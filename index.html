<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 تولدت مبارک 🎂</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif;
}

body{
    overflow:hidden;
    background:linear-gradient(-45deg,#ff6ec4,#7873f5,#00c9ff,#92fe9d);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
    text-align:center;
}

@keyframes bg{
    0%{background-position:0 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0 50%;}
}

.card{
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
    padding:40px;
    border-radius:25px;
    box-shadow:0 0 30px rgba(0,0,0,.3);
}

h1{
    font-size:60px;
    animation:glow 2s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px white;}
to{text-shadow:0 0 35px yellow;}
}

p{
    font-size:26px;
    margin-top:20px;
}

button{
    margin-top:25px;
    padding:15px 30px;
    border:none;
    border-radius:50px;
    font-size:20px;
    cursor:pointer;
    background:#fff;
    color:#ff1493;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

.balloon{
    position:absolute;
    bottom:-120px;
    width:60px;
    height:80px;
    border-radius:50%;
    animation:float linear infinite;
}

.balloon::after{
    content:"";
    position:absolute;
    width:2px;
    height:60px;
    background:white;
    left:50%;
    top:80px;
}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(-130vh);}
}
</style>

</head>
<body>

<div class="card">
<h1>🎉 تولدت مبارک 🎂</h1>

<p>
خواهر عزیزم ❤️<br><br>
امیدوارم همیشه سالم، خوشحال و موفق باشی.<br>
هر آرزویی که داری به حقیقت تبدیل بشه.<br><br>

دوستت دارم 💖
</p>

<button onclick="music.play()">🎵 پخش موسیقی</button>

<audio id="music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

</div>

<script>
const music=document.getElementById("music");

const colors=["#ff4d6d","#ffd60a","#00e5ff","#7b2cbf","#2ec4b6"];

for(let i=0;i<25;i++){

let b=document.createElement("div");

b.className="balloon";

b.style.left=Math.random()*100+"vw";

b.style.background=colors[Math.floor(Math.random()*colors.length)];

b.style.animationDuration=(8+Math.random()*8)+"s";

b.style.animationDelay=Math.random()*6+"s";

document.body.appendChild(b);

}

function confetti(){

for(let i=0;i<250;i++){

let c=document.createElement("div");

c.style.position="absolute";

c.style.width="8px";

c.style.height="8px";

c.style.background=colors[Math.floor(Math.random()*colors.length)];

c.style.left=Math.random()*window.innerWidth+"px";

c.style.top="-10px";

c.style.transform="rotate("+Math.random()*360+"deg)";

document.body.appendChild(c);

let y=0;

let x=(Math.random()-0.5)*4;

let fall=setInterval(()=>{

y+=4;

c.style.top=y+"px";

c.style.left=(parseFloat(c.style.left)+x)+"px";

if(y>window.innerHeight){

clearInterval(fall);

c.remove();

}

},20);

}

}

setTimeout(confetti,1000);
</script>

</body>
</html>
