<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تولد مبارک نازنین 🎂</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="stars"></div>
<div id="balloons"></div>
<div id="hearts"></div>
<div id="confetti"></div>

<audio id="music" loop>
    <source src="happy.mp3" type="audio/mpeg">
</audio>


<div class="container">

    <h1>
        🎉 تولدت مبارک نازنین 🎉
    </h1>


    <div class="age">
        💖 17 ساله شدی 💖
    </div>


    <p class="message">

        نازنین عزیزم ❤️<br><br>

        امیدوارم همیشه سالم، خوشحال و موفق باشی.<br>
        امیدوارم هر آرزویی که داری به حقیقت تبدیل بشه.<br>
        تو یکی از قشنگ‌ترین آدم‌های زندگی من هستی ✨

        <br><br>

        🎂 تولدت مبارک 🎂

    </p>


    <div class="cake">
        🎂
    </div>


    <button onclick="playMusic()">
        🎵 پخش موسیقی
    </button>


    <button onclick="openGift()">
        🎁 باز کردن هدیه
    </button>


    <div id="gift" class="hidden">

        💝 سورپرایز مخصوص نازنین 💝

        <br><br>

        همیشه لبخند روی لبت باشه ❤️

    </div>


</div>



<script src="script.js"></script>

</body>
</html>
